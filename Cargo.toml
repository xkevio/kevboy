[package]
name = "kevboy"
version = "0.4.0"
edition = "2024"
authors = ["xkevio"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
eframe = {version = "0.37.0", features = ["persistence"] }
egui = { version = "0.37.0", features = ["serde"] }
egui-phosphor = "0.14"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
gilrs = { version = "0.11.2", features = ["serde-serialize"] }
hashlink = { version = "0.12.2", features = ["serde", "serde_impl"] }
image = "0.25.10"
rfd = "0.17.2"
rodio = { version = "0.23.0", default-features = false }
serde = "1.0.229"
